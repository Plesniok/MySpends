[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "my-spends-api"
version = "0.1.0"
description = "FastAPI backend for receipt-based expense tracking with Supabase."
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.14,<2",
  "anyio>=4.4,<4.10",
  "fastapi>=0.115,<0.116",
  "httpx>=0.28,<1",
  "pillow>=11.1,<13",
  "pillow-heif>=1.1,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.17,<1",
  "sqlalchemy>=2.0,<3",
  "supabase>=2.28,<2.32",
  "uvicorn[standard]>=0.34,<0.38",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
