services:
  # Keeps Ollama private on 127.0.0.1 while making it reachable from Docker.
  # `network_mode: host` is intentionally used here for Linux hosts.
  ollama-bridge:
    build:
      context: .
      dockerfile: docker/ollama-bridge.Dockerfile
    network_mode: host
    command:
      - TCP-LISTEN:11434,bind=${OLLAMA_BRIDGE_ADDRESS:-172.17.0.1},reuseaddr,fork
      - TCP:127.0.0.1:11434
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -qO- http://${OLLAMA_BRIDGE_ADDRESS:-172.17.0.1}:11434/api/version >/dev/null"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Ollama runs on the host, not in this Compose stack.
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      ollama-bridge:
        condition: service_healthy
    command: >-
      sh -c "alembic upgrade head && python -m app.scripts.bootstrap_storage &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8029:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health').read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8089:80"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -qO- http://localhost/health | grep -q ok"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
